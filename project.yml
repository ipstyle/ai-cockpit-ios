# Das Xcode-Projekt entsteht aus dieser Datei — `xcodegen generate`.
# Deshalb steht `*.xcodeproj` in der .gitignore: Zwei Leute, die dieselbe
# Projektdatei bearbeiten, erzeugen einen Konflikt, den niemand auflösen mag.
# Hier ist er unmöglich.
name: AICockpitMobile
options:
  bundleIdPrefix: com.ip-style
  # Englisch ist die Primärsprache: Was im Katalog keine Übersetzung hat,
  # erscheint englisch, nicht deutsch. Die Angabe muss buchstabengleich zu
  # `CFBundleDevelopmentRegion` in App/Resources/Info.plist stehen — sonst
  # streiten sich Projektdatei und Info-Datei darüber, welche Sprache
  # einspringt, und iOS glaubt der Info-Datei.
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Der Kern wird nicht kopiert, sondern aus dem Mac-Projekt gelesen — dasselbe
# Swift, dieselben 188 Tests. Der Pfad ist bewusst relativ: beide Ordner liegen
# im selben iCloud-Verzeichnis nebeneinander. Gegen welchen Stand gebaut wurde,
# hält `KERN-STAND.md` fest; `Tools/kern-stand.sh` schreibt ihn fort.
packages:
  AgentDeckCore:
    path: ../../APP_AICockpit/02_Git-Repo

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  AICockpitMobile:
    type: application
    platform: iOS
    # iPhone und iPad aus einem Ziel — 1 = iPhone, 2 = iPad.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.ip-style.aicockpitmobile
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/AICockpitMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Signiert wird von Hand: Alberts App-Store-Connect-Schlüssel hat
        # keine Rechte fürs Cloud-Signing, und ohne Profilnamen je Ziel
        # bricht das Archiv mit «requires a provisioning profile with the
        # App Groups feature» ab. Nur in Release — sonst liesse sich für
        # ein angestecktes Gerät nichts mehr bauen.
        Release:
          DEVELOPMENT_TEAM: UGLPKQFM9U
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AI Cockpit Mobile App Store"
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: AgentDeckCore
        product: AgentDeckCore
      - target: AICockpitWidget
        embed: true
      # Die Uhr-App reist in der iPhone-App mit. Damit geht sie im selben
      # App-Record und in derselben Fassung in den Store — kein zweiter
      # Eintrag, keine zweite Preisentscheidung.
      - target: AICockpitWatch
        embed: true

  AICockpitWidget:
    type: app-extension
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.ip-style.aicockpitmobile.widget
        INFOPLIST_FILE: Widget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Resources/AICockpitWidget.entitlements
      configs:
        Release:
          DEVELOPMENT_TEAM: UGLPKQFM9U
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AI Cockpit Mobile Widget App Store"
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      - package: AgentDeckCore
        product: AgentDeckCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # Die Uhr-Fassung. Sie hält kein einziges Geheimnis und hat deshalb auch
  # keine Schlüsselbund-Gruppe in den Berechtigungen: Ein Refresh-Token darf
  # nur an einer Stelle eingelöst werden, und diese Stelle ist das iPhone.
  AICockpitWatch:
    type: application
    platform: watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ip-style.aicockpitmobile.watchkitapp
        INFOPLIST_FILE: Watch/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/Resources/AICockpitWatch.entitlements
        # Ohne diesen Namen liefert Apple bei der Prüfung 90713 und 90391 —
        # die Uhr-App braucht ein eigenes Symbol, das der iPhone-App genügt
        # ihr nicht.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          DEVELOPMENT_TEAM: UGLPKQFM9U
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AI Cockpit Mobile Watch App Store"
    sources:
      - path: Watch
      - path: WatchGeteilt
      - path: Shared
    dependencies:
      - package: AgentDeckCore
        product: AgentDeckCore
      - target: AICockpitWatchWidget
        embed: true

  AICockpitWatchWidget:
    type: app-extension
    platform: watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ip-style.aicockpitmobile.watchkitapp.widget
        INFOPLIST_FILE: WatchWidget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchWidget/Resources/AICockpitWatchWidget.entitlements
      configs:
        Release:
          DEVELOPMENT_TEAM: UGLPKQFM9U
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AI Cockpit Mobile Watch Widget App Store"
    sources:
      - path: WatchWidget
      - path: WatchGeteilt
      - path: Shared
    dependencies:
      - package: AgentDeckCore
        product: AgentDeckCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # Bis hierher hatte die iOS-Fassung kein Testziel — geprüft wurde
  # ausschliesslich der Kern im Mac-Projekt. Für `Urteil` reicht das nicht: Die
  # Ableitung liegt in `Shared/` und entscheidet, was auf dem Handgelenk steht.
  AICockpitTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests
    dependencies:
      - target: AICockpitMobile

schemes:
  AICockpitMobile:
    build:
      targets:
        AICockpitMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AICockpitTests
  AICockpitWatch:
    build:
      targets:
        AICockpitWatch: all
    run:
      config: Debug
